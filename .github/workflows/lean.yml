name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          use-github-cache: false
          build: false
      - name: Install pinned Tectonic
        env:
          TECTONIC_SHA256: 60b13a0826ae7ad9ce34b4a2df06bff2cfcfa6dda8a915477c0cbb84e1a4a902
        run: |
          archive="$RUNNER_TEMP/tectonic-0.16.9.tar.gz"
          bin_dir="$RUNNER_TEMP/tectonic-0.16.9"
          curl -fsSL \
            'https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.16.9/tectonic-0.16.9-x86_64-unknown-linux-musl.tar.gz' \
            -o "$archive"
          echo "$TECTONIC_SHA256  $archive" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Run verification checks
        run: bash scripts/check_release.sh
      - name: Verify pinned PDF build
        run: bash scripts/build_pdf.sh --check
